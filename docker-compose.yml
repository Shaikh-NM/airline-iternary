services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: itinerary
      POSTGRES_USER: itinerary
      POSTGRES_PASSWORD: itinerary
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itinerary -d itinerary"]
      interval: 3s
      timeout: 3s
      retries: 10

  web:
    build: .
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    environment:
      DJANGO_SECRET_KEY: change-me-in-production
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      POSTGRES_HOST: db
      POSTGRES_DB: itinerary
      POSTGRES_USER: itinerary
      POSTGRES_PASSWORD: itinerary
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
